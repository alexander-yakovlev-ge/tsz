# Режим разработки: исходники монтируются в контейнеры, изменения подхватываются без пересборки.
# Запуск: make dev. Для приёмки этапа не используется (там — чистая сборка, make accept).
services:
  api:
    build:
      target: dev
    image: tsz-dev:local
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        pnpm --filter @tsz/shared dev &
        pnpm --filter @tsz/api dev &
        cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/seed.js &&
        exec node --watch dist/main.js
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/shared/src:/app/packages/shared/src

  worker:
    build:
      target: dev
    image: tsz-dev:local
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        pnpm --filter @tsz/shared dev &
        pnpm --filter @tsz/api dev &
        cd apps/api && exec node --watch dist/worker.js
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      target: dev
    image: tsz-dev:local
    working_dir: /app
    command: ['pnpm', '--filter', '@tsz/web', 'dev']
    environment:
      API_INTERNAL_URL: http://api:3001
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/messages:/app/apps/web/messages
      - ./packages/shared/src:/app/packages/shared/src
