# Локальный и серверный стек (ТЗ п. 2.2, plan.md этап 1).
# Запуск: make up. Проверка этапа: make accept.
name: tsz

x-api-env: &api-env
  DATABASE_URL: postgresql://tsz:${POSTGRES_PASSWORD}@postgres:5432/tsz?schema=public
  S3_ENDPOINT: http://storage:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: files

x-node-health: &node-health
  interval: 10s
  timeout: 5s
  retries: 6

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TLS_MODE: ${TLS_MODE}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      target: web
    image: tsz-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
      SITE_URL: ${SITE_URL:-https://localhost}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/ka').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      <<: *node-health
      start_period: 30s

  api:
    build:
      context: .
      target: api
    image: tsz-api:local
    restart: unless-stopped
    environment:
      <<: *api-env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
      ENABLE_TEST_API: ${ENABLE_TEST_API:-false}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      <<: *node-health
      start_period: 60s

  worker:
    build:
      context: .
      target: api
    image: tsz-api:local
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-env
    depends_on:
      # api применяет миграции при старте — воркер ждёт его готовности.
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      <<: *node-health
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsz
      POSTGRES_USER: tsz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tsz -d tsz']
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./infra/storage/entrypoint.sh:/entrypoint.sh:ro
      - storage_data:/data
    ports:
      # Веб-интерфейс filer для просмотра файлов — только локально (убирается в prod-оверлее).
      - '127.0.0.1:8888:8888'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 24

  # --- Инструменты проверки (profiles: test, tools) ---

  tools:
    profiles: [tools]
    build:
      context: .
      target: dev
    image: tsz-dev:local
    environment:
      <<: *api-env
      FIXTURES_DIR: /app/data/fixtures
    volumes:
      - ./data:/app/data
    command: ['sh']

  e2e:
    profiles: [test]
    build:
      context: ./e2e
    image: tsz-e2e:local
    environment:
      BASE_URL: https://proxy
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      proxy:
        condition: service_healthy

  smoke:
    profiles: [test]
    image: curlimages/curl:8.16.0
    entrypoint: ['/bin/sh', '/smoke.sh']
    environment:
      BASE_URL: https://proxy
    volumes:
      - ./scripts/smoke.sh:/smoke.sh:ro
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  pgdata:
  storage_data:
  caddy_data:
  caddy_config:
